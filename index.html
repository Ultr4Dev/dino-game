<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>The Isle Skin Editor</title>
    <style>
        body {
            background-color: #000000;
            color: #4da6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            border: 2px solid #0055ff;
            background-color: #00051a;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.3);
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid #0055ff;
            padding-bottom: 10px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            flex: 1;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            background-color: #001133;
            color: #4da6ff;
            border: 1px solid #0055ff;
            padding: 8px;
            font-family: inherit;
        }

        input[type="color"] {
            flex: 1;
            height: 35px;
            background-color: #001133;
            border: 1px solid #0055ff;
            cursor: pointer;
        }

        .disabled-setting {
            opacity: 0.45;
        }

        .divider {
            height: 1px;
            background-color: #0055ff;
            margin: 20px 0;
        }

        .output-box {
            background-color: #001133;
            border: 1px dashed #0055ff;
            padding: 15px;
            text-align: center;
            word-break: break-all;
            font-size: 1.1em;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1.1em;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3377ff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 id="title">SKIN CODE GENERATOR</h2>

        <div>
            <p id="gameInfo"></p>
            <p>Might not be compatible with other versions or game branches.</p>
        </div>
        <div class="divider"></div>
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="importInput" style="flex: 0.8;">Import Code:</label>
            <input type="text" id="importInput" placeholder="Paste skin code here..."
                style="margin-right: 10px; flex: 1.5;">
            <button id="importBtn" onclick="importCode()"
                style="width: auto; padding: 8px 15px; font-size: 0.9em; flex: 0.7;">Import</button>
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label for="species">Species:</label>
            <select id="species">
                <option value="" selected>None</option>
                <optgroup label="Herbivores">
                    <option value="Diabloceratops">Diabloceratops</option>
                    <option value="Dryosaurus">Dryosaurus</option>
                    <option value="Hypsilophodon">Hypsilophodon</option>
                    <option value="Kentrosaurus">Kentrosaurus</option>
                    <option value="Maiasaura">Maiasaura</option>
                    <option value="Pachycephalosaurus">Pachycephalosaurus</option>
                    <option value="Stegosaurus">Stegosaurus</option>
                    <option value="Tenontosaurus">Tenontosaurus</option>
                    <option value="Triceratops">Triceratops</option>
                </optgroup>
                <optgroup label="Carnivores">
                    <option value="Allosaurus">Allosaurus</option>
                    <option value="Austroraptor">Austroraptor</option>
                    <option value="Carnotaurus">Carnotaurus</option>
                    <option value="Ceratosaurus">Ceratosaurus</option>
                    <option value="Deinosuchus">Deinosuchus</option>
                    <option value="Dilophosaurus">Dilophosaurus</option>
                    <option value="Herrerasaurus">Herrerasaurus</option>
                    <option value="Omniraptor">Omniraptor</option>
                    <option value="Pteranodon">Pteranodon</option>
                    <option value="Troodon">Troodon</option>
                    <option value="Tyrannosaurus">Tyrannosaurus</option>
                </optgroup>
                <optgroup label="Omnivores">
                    <option value="Beipiaosaurus">Beipiaosaurus</option>
                    <option value="Gallimimus">Gallimimus</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="pattern">Pattern (0-9):</label>
            <input type="number" id="pattern" value="0" min="0" max="9">
        </div>
        <div class="form-group">
            <label for="variation">Variation (0-9):</label>
            <input type="number" id="variation" value="1" min="0" max="9">
        </div>
        <div class="form-group">
            <label for="theme">Theme (0-9):</label>
            <input type="number" id="theme" value="0" min="0" max="9">
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label for="color1">Male Display:</label>
            <input type="color" id="color1" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color2">Markings:</label>
            <input type="color" id="color2" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color3">Flank:</label>
            <input type="color" id="color3" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color4">Body:</label>
            <input type="color" id="color4" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color5">Underbelly:</label>
            <input type="color" id="color5" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color6">Teeth:</label>
            <input type="color" id="color6" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color7">Mouth:</label>
            <input type="color" id="color7" value="#FFFFFF">
        </div>
        <div class="form-group">
            <label for="color8">Claws:</label>
            <input type="color" id="color8" value="#FFFFFF">
        </div>
        <div class="divider"></div>

        <div class="output-box" id="outputCode"></div>

        <button onclick="copyCode()" id="copyBtn">Copy Code to Clipboard</button>
    </div>

    <script>
        const inputs = document.querySelectorAll('input, select');
        const outputDisplay = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyBtn');

        const notLimitedDinosaurs = ['Omniraptor'];

        onload = updateMeta;
        function updateMeta() {
            // Load manifest.json
            fetch('manifest.json')
                .then(response => response.json())
                .then(data => {
                    const gameInfo = document.getElementById('gameInfo');
                    const title = document.getElementById('title');
                    title.textContent = `SKIN CODE GENERATOR - Version ${data.version}`;
                    gameInfo.textContent = `Developed for ${data.game.latest_tested_version} (${data.game.developed_for_game_branch})`;
                })
                .catch(error => {
                    console.error('Error loading manifest.json:', error);
                });
        }

        function updateOmniraptorOnlySettings() {
            const isNotLimited = notLimitedDinosaurs.includes(document.getElementById('species').value);
            ['color6', 'color7', 'color8'].forEach(id => {
                const input = document.getElementById(id);
                const group = input.closest('.form-group');
                input.disabled = !isNotLimited;
                group.classList.toggle('disabled-setting', !isNotLimited);
                // Hide the color pickers when disabled to avoid confusion
                input.style.display = isNotLimited ? 'block' : 'none';
                // Also hide the labels for these inputs when disabled
                const label = group.querySelector('label');
                if (label) {
                    label.style.display = isNotLimited ? 'block' : 'none';
                }
            });
        }

        function ensureSpeciesOption(species) {
            const speciesSelect = document.getElementById('species');
            const hasOption = Array.from(speciesSelect.options).some(option => option.value === species);

            if (!hasOption) {
                const option = document.createElement('option');
                option.value = species;
                option.textContent = species;
                speciesSelect.appendChild(option);
            }

            speciesSelect.value = species;
        }

        function formatColor(hexString) {
            return hexString.replace('#', '').toUpperCase() + 'FF';
        }

        function generateCode() {
            const species = document.getElementById('species').value;
            updateOmniraptorOnlySettings();
            const pattern = document.getElementById('pattern').value;
            const variation = document.getElementById('variation').value;
            const theme = document.getElementById('theme').value;

            const c1 = formatColor(document.getElementById('color1').value); // Male Display
            const c2 = formatColor(document.getElementById('color2').value); // Markings
            const c3 = formatColor(document.getElementById('color3').value); // Flank
            const c4 = formatColor(document.getElementById('color4').value); // Body
            const c5 = formatColor(document.getElementById('color5').value); // Underbelly
            let c6 = ''; // Default empty for Teeth
            let c7 = ''; // Default empty for Mouth
            let c8 = ''; // Default empty for Claws

            if (document.getElementById('species').value === 'Omniraptor') {
                c6 = formatColor(document.getElementById('color6').value); // Teeth (disabled)
                c7 = formatColor(document.getElementById('color7').value); // Mouth (disabled)
                c8 = formatColor(document.getElementById('color8').value); // Claws (disabled)
            }
            const finalCode = `${species}${pattern}${variation}${theme}${c8}${c7}${c6}${c5}${c4}${c3}${c2}${c1}`;
            outputDisplay.textContent = finalCode;

            copyBtn.textContent = "Copy Code to Clipboard";
        }

        function copyCode() {
            navigator.clipboard.writeText(outputDisplay.textContent).then(() => {
                copyBtn.textContent = "Copied!";
            });
        }

        function importCode() {
            const importInput = document.getElementById('importInput');
            const code = importInput.value.trim();

            if (!code) {
                alert("Please paste a skin code to import.");
                return;
            }

            const speciesOptions = Array.from(document.getElementById('species').options)
                .map(option => option.value)
                .filter(value => value);
            const matchingSpecies = speciesOptions
                .filter(species => code.startsWith(species))
                .sort((a, b) => b.length - a.length)[0];
            const species = matchingSpecies !== undefined
                ? matchingSpecies
                : (code.charAt(0) && !/\d/.test(code.charAt(0)) ? code.substring(0, code.search(/\d/)) : '');

            const L = code.length;
            const baseIndex = species.length;
            const metadataLength = 3;
            const remainingLength = L - baseIndex - metadataLength;

            if (L < baseIndex + metadataLength + 40) {
                alert("Invalid skin code. The code is too short.");
                return;
            }

            const pattern = code.charAt(baseIndex);
            const variation = code.charAt(baseIndex + 1);
            const theme = code.charAt(baseIndex + 2);

            if (isNaN(pattern) || isNaN(variation) || isNaN(theme)) {
                alert("Invalid skin code. Pattern, variation, and theme must be numeric digits.");
                return;
            }

            const hexRegex = /^[0-9A-F]{8}$/i;
            let c8 = '';
            let c7 = '';
            let c6 = '';
            let c5 = '';
            let c4 = '';
            let c3 = '';
            let c2 = '';
            let c1 = '';

            if (remainingLength === 40) {
                c5 = code.substring(L - 40, L - 32);
                c4 = code.substring(L - 32, L - 24);
                c3 = code.substring(L - 24, L - 16);
                c2 = code.substring(L - 16, L - 8);
                c1 = code.substring(L - 8, L);
            } else if (remainingLength === 64) {
                c8 = code.substring(L - 64, L - 56);
                c7 = code.substring(L - 56, L - 48);
                c6 = code.substring(L - 48, L - 40);
                c5 = code.substring(L - 40, L - 32);
                c4 = code.substring(L - 32, L - 24);
                c3 = code.substring(L - 24, L - 16);
                c2 = code.substring(L - 16, L - 8);
                c1 = code.substring(L - 8, L);
            } else {
                alert("Invalid skin code. Color segments are malformed.");
                return;
            }

            if (!hexRegex.test(c5) || !hexRegex.test(c4) || !hexRegex.test(c3) || !hexRegex.test(c2) || !hexRegex.test(c1) || (remainingLength === 64 && (!hexRegex.test(c8) || !hexRegex.test(c7) || !hexRegex.test(c6)))) {
                alert("Invalid skin code. Color segments are malformed.");
                return;
            }

            ensureSpeciesOption(species);
            document.getElementById('pattern').value = pattern;
            document.getElementById('variation').value = variation;
            document.getElementById('theme').value = theme;

            document.getElementById('color1').value = '#' + c1.substring(0, 6);
            document.getElementById('color2').value = '#' + c2.substring(0, 6);
            document.getElementById('color3').value = '#' + c3.substring(0, 6);
            document.getElementById('color4').value = '#' + c4.substring(0, 6);
            document.getElementById('color5').value = '#' + c5.substring(0, 6);
            document.getElementById('color6').value = remainingLength === 64 ? '#' + c6.substring(0, 6) : '#FFFFFF';
            document.getElementById('color7').value = remainingLength === 64 ? '#' + c7.substring(0, 6) : '#FFFFFF';
            document.getElementById('color8').value = remainingLength === 64 ? '#' + c8.substring(0, 6) : '#FFFFFF';

            generateCode();
            importInput.value = '';
        }

        inputs.forEach(input => {
            input.addEventListener('input', generateCode);
        });

        generateCode();
    </script>

</body>

</html>
