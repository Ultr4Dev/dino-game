<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>The Isle Skin Editor</title>
    <link rel="stylesheet" href="static/style.css">
    <meta name="description"
        content="A web-based skin code generator for The Isle, allowing users to create and customize dinosaur skins with an intuitive interface.">
    <meta name="keywords"
        content="The Isle, skin code generator, dinosaur skins, web-based tool, customization, pattern, variation, theme, color selection">

</head>

<body>

    <div class="layout">
        <div class="container" style="max-width: 400px;">
            <h2 id="title">SKIN CODE GENERATOR</h2>

            <div>
                <p id="gameInfo"></p>
                <p>Might not be compatible with other versions or game branches.</p>
            </div>
            <div class="divider"></div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="importInput" style="flex: 0.8;">Import Code:</label>
                <input type="text" id="importInput" placeholder="Paste skin code here..."
                    style="margin-right: 10px; flex: 1.5;">
                <button id="importBtn" onclick="importCode()"
                    style="width: auto; padding: 8px 15px; font-size: 0.9em; flex: 0.7;">Import</button>
            </div>

            <div class="divider"></div>

            <div class="form-group">
                <label for="species">Species:</label>
                <select id="species">
                    <option value="" selected>None</option>
                    <optgroup label="Herbivores">
                        <option value="Diabloceratops">Diabloceratops</option>
                        <option value="Dryosaurus">Dryosaurus</option>
                        <option value="Hypsilophodon">Hypsilophodon</option>
                        <option value="Kentrosaurus">Kentrosaurus</option>
                        <option value="Maiasaura">Maiasaura</option>
                        <option value="Pachycephalosaurus">Pachycephalosaurus</option>
                        <option value="Stegosaurus">Stegosaurus</option>
                        <option value="Tenontosaurus">Tenontosaurus</option>
                        <option value="Triceratops">Triceratops</option>
                    </optgroup>
                    <optgroup label="Carnivores">
                        <option value="Allosaurus">Allosaurus</option>
                        <option value="Austroraptor">Austroraptor</option>
                        <option value="Carnotaurus">Carnotaurus</option>
                        <option value="Ceratosaurus">Ceratosaurus</option>
                        <option value="Deinosuchus">Deinosuchus</option>
                        <option value="Dilophosaurus">Dilophosaurus</option>
                        <option value="Herrerasaurus">Herrerasaurus</option>
                        <option value="Omniraptor">Omniraptor</option>
                        <option value="Pteranodon">Pteranodon</option>
                        <option value="Troodon">Troodon</option>
                        <option value="Tyrannosaurus">Tyrannosaurus</option>
                    </optgroup>
                    <optgroup label="Omnivores">
                        <option value="Beipiaosaurus">Beipiaosaurus</option>
                        <option value="Gallimimus">Gallimimus</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="pattern">Pattern (0-9):</label>
                <input type="number" id="pattern" value="0" min="0" max="9">
            </div>
            <div class="form-group">
                <label for="variation">Variation (0-9):</label>
                <input type="number" id="variation" value="1" min="0" max="9">
            </div>
            <div class="form-group">
                <label for="theme">Theme (0-9):</label>
                <input type="number" id="theme" value="0" min="0" max="9">
            </div>

            <div class="divider"></div>

            <div class="form-group">
                <label for="color1">Male Display:</label>
                <input type="color" id="color1" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color2">Markings:</label>
                <input type="color" id="color2" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color3">Flank:</label>
                <input type="color" id="color3" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color4">Body:</label>
                <input type="color" id="color4" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color5">Underbelly:</label>
                <input type="color" id="color5" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color6">Teeth:</label>
                <input type="color" id="color6" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color7">Mouth:</label>
                <input type="color" id="color7" value="#FFFFFF">
            </div>
            <div class="form-group">
                <label for="color8">Claws:</label>
                <input type="color" id="color8" value="#FFFFFF">
            </div>
            <div class="divider"></div>

            <div class="output-box" id="outputCode"></div>

            <button onclick="copyCode()" id="copyBtn">Copy Code to Clipboard</button>
            <div class="divider"></div>
            <button onclick="addToHistory()" id="saveHistoryBtn">Save to History</button>
        </div>

        <div class="container secondary-container">
            <h2>Skin Code History</h2>
            <p>Previous skin codes will be displayed here for easy access and management.</p>

            <table id="historyTable" class="table-container">
                <thead>
                    <tr>
                        <th>Species</th>
                        <th>Pattern</th>
                        <th>Variation</th>
                        <th>Theme</th>
                        <th>Colour</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #777;">No skin codes generated yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="static/script.js"></script>

</body>

</html>
